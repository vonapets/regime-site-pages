name: nightly-publish

# Starts build-and-publish in the private regime-site repo after each US session, because that repo's own
# schedule has never fired. Times match publish.yml: 03:07 UTC Tue-Sat (22:07 ET winter / 23:07 ET summer),
# with an 11:37 UTC backup for nights Cboe posts late. A run before the data is in stops without publishing.
#
# This branch (timer, the default branch) holds only this file. The site lives on main, which Pages serves and
# each publish replaces. PUBLISH_TOKEN is a fine-grained token for regime-site only, with Actions read and write:
# it can start that repo's workflow runs and nothing else. No code or data from regime-site is in this repo.
on:
  schedule:
    - cron: "7 3 * * 2-6"
    - cron: "37 11 * * 2-6"
  workflow_dispatch:

permissions: {}

jobs:
  start-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start build-and-publish on regime-site main
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "The PUBLISH_TOKEN secret is not set in this repo" >&2; exit 1; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vonapets/regime-site/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Started build-and-publish on regime-site main"
